# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting

# Environment configuration
env:
  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    secret: NEXT_PUBLIC_SANITY_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SANITY_DATASET
    secret: NEXT_PUBLIC_SANITY_DATASET
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SANITY_API_VERSION
    secret: NEXT_PUBLIC_SANITY_API_VERSION
    availability:
      - BUILD
      - RUNTIME

  - variable: SANITY_API_WRITE_TOKEN
    secret: SANITY_API_WRITE_TOKEN
    availability:
      - BUILD
      - RUNTIME

  - variable: SANITY_REVALIDATE_SECRET
    secret: SANITY_REVALIDATE_SECRET
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_ZEPTOMAIL_HOST
    secret: NEXT_PUBLIC_ZEPTOMAIL_HOST
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_ZEPTOMAIL_TOKEN
    secret: NEXT_PUBLIC_ZEPTOMAIL_TOKEN
    version: "4"
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_ZEPTOMAIL_BOUNCE_ADDRESS
    secret: NEXT_PUBLIC_ZEPTOMAIL_BOUNCE_ADDRESS
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_CONTACT_FORM_RECIPIENT_EMAIL
    secret: NEXT_PUBLIC_CONTACT_FORM_RECIPIENT_EMAIL
    availability:
      - RUNTIME

  - variable: ZEPTOMAIL_TOKEN
    secret: NEXT_PUBLIC_ZEPTOMAIL_TOKEN
    version: "4"
    availability:
      - RUNTIME

  - variable: ZEPTOMAIL_BOUNCE_ADDRESS
    secret: NEXT_PUBLIC_ZEPTOMAIL_BOUNCE_ADDRESS
    availability:
      - RUNTIME

  - variable: ZEPTOMAIL_SENDER_ADDRESS
    secret: NEXT_PUBLIC_ZEPTOMAIL_BOUNCE_ADDRESS
    availability:
      - RUNTIME

  - variable: CONTACT_FORM_RECIPIENT_EMAIL
    secret: NEXT_PUBLIC_CONTACT_FORM_RECIPIENT_EMAIL
    availability:
      - RUNTIME

  - variable: BUSINESS_PROFILE_RECIPIENT_EMAIL
    secret: BUSINESS_PROFILE_RECIPIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - RUNTIME

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME

  # ---- Admin dashboard access (Firebase Auth + email allowlist) ----

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  # Serves Firebase's sign-in handler from our own origin, which is what makes
  # signInWithRedirect viable: the returning credential stays first-party
  # instead of landing in *.firebaseapp.com storage that browsers partition
  # away. Requires https://<host>/__/auth/handler to be registered on the OAuth
  # client for every host that builds with this on, or Google answers with
  # redirect_uri_mismatch.
  #
  # Proven on preview before it came here: signing in on the Mac completes
  # without a popup, which the background-tab freeze made impossible.


  - variable: NEXT_PUBLIC_FIREBASE_SAME_ORIGIN_AUTH
    value: "1"
    availability:
      - BUILD
      - RUNTIME

  # ---- DXI assistant ----
  # BUILD as well as RUNTIME: the root layout calls botIsConfigured() to decide
  # whether to render the widget at all, and that runs while the page is being
  # rendered. Without it at build time the widget would be compiled out.
  #
  # Naming a secret here that does not exist in Secret Manager fails the build,
  # so this was added only after `apphosting:secrets:describe` confirmed it and
  # both backends were granted access.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: GEMINI_MODEL
    value: gemini-3.6-flash
    availability:
      - BUILD
      - RUNTIME

  - variable: BOT_HANDOFF_TIMEOUT_MINUTES
    value: "15"
    availability:
      - RUNTIME

  - variable: BOT_HOURLY_MESSAGE_LIMIT
    value: "40"
    availability:
      - RUNTIME

  # ---- Meta channels (WhatsApp, Messenger, Instagram) ----
  # One Meta app, three products, one webhook: /api/webhooks/meta. The bot
  # itself is already channel-agnostic, so these four values plus the Meta-side
  # setup in META_SETUP.md are the whole of it.
  #
  # RUNTIME only, unlike GEMINI_API_KEY. Nothing about these is read while
  # pages are being rendered — the webhook is a route handler, and there is no
  # widget whose existence depends on them.
  #
  # Every secret named here must exist in Secret Manager before this file
  # names it, and both backends must be granted access. Naming one that does
  # not exist fails the build for the whole site, marketing pages included.
  - variable: META_APP_SECRET
    secret: META_APP_SECRET
    availability:
      - RUNTIME

  - variable: META_VERIFY_TOKEN
    secret: META_VERIFY_TOKEN
    availability:
      - RUNTIME

  # System-user token carrying the WhatsApp scopes, and the fallback for the
  # Messenger and Instagram Page-token lookup — one all-scope token in one
  # secret can run all three channels.
  #
  # Commented out until the token exists, because naming a secret that is not
  # in Secret Manager fails the build for the whole site. Nothing needs it yet:
  # the webhook handshake and every inbound message work without it, and only
  # *sending* fails. Create the secret, grant both backends, uncomment, deploy.
  #
  #   firebase apphosting:secrets:set WHATSAPP_TOKEN
  #
  # - variable: WHATSAPP_TOKEN
  #   secret: WHATSAPP_TOKEN
  #   availability:
  #     - RUNTIME

  # Only the fallback: the number a conversation actually arrived on is stored
  # on the conversation and wins, so this covers just the first message on a
  # number added before that field existed.
  #
  # Commented out rather than left empty. App Hosting rejects `value: ""` and
  # fails the build — an empty env var has to be an absent one. The code reads
  # it as "" either way.
  #
  # - variable: WHATSAPP_PHONE_NUMBER_ID
  #   value: "<phone number id from WhatsApp > API Setup>"
  #   availability:
  #     - RUNTIME

  # Pinned rather than left to Meta's default, so a version rollover cannot
  # change a response shape under a live webhook without anyone deciding to.
  - variable: META_GRAPH_VERSION
    value: v23.0
    availability:
      - RUNTIME

  # ---- Short links ----
  # The address every link this site hands out is built against — the
  # assistant's WhatsApp replies, the dashboard's Copy link buttons, the public
  # share control. Set for BUILD too because the browser-side ones read it
  # through process.env, which Next inlines at build time.
  #
  # The same value on the preview backend as on live, deliberately. Preview
  # serves the same dashboard, and a link copied there used to carry the
  # preview host into a message or onto a flyer that outlives it.
  #
  # Defaults to https://dximarketing.com in code, so a backend without it still
  # sends working links; it is set here so that default never becomes load
  # bearing without anyone noticing.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://dximarketing.com
    availability:
      - BUILD
      - RUNTIME

  # ---- Google Analytics (via the Firebase web app) ----
  # Plain values, not Secret Manager entries, unlike the Firebase keys above.
  # These three are shipped to every browser in the JS bundle by definition —
  # an app id and a GA4 measurement id are public identifiers, not credentials,
  # and putting them behind a secret would suggest otherwise while protecting
  # nothing.
  #
  # BUILD as well as RUNTIME: they are read through process.env in client
  # components, which Next inlines at build time. Runtime-only values would
  # compile to undefined and analytics would silently never start.
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:573410811306:web:6c16ecc4498125d3abdfd3"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-YRK0M86VH7
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: dxi-website-backed.appspot.com
    availability:
      - BUILD
      - RUNTIME
